[project]
name = "cat-talker"
version = "0.1.0"
description = "A real-time voice and vision AI agent using Gemini Multimodal Live API"
dependencies = [
    "google-genai>=2.25.0",
    "pyaudio>=0.2.14",
    "mss>=9.0.2",
    "opencv-python>=4.11.0.86",
    "PyQt6>=6.8.1",
    "markdown>=3.6",
    "pygments>=2.17"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
